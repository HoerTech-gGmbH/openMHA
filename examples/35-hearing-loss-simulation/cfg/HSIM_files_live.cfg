# This configuration simulates a specified hearing impairment by processing a 
# looped sound file in real time, using Jack as the audio I/O backend. The 
# default parameter values given in this file correspond to a symmetric, 
# moderately sloping hearing loss of type N1 (Bisgaard et al., 2010). The type 
# of hearing loss can easily be changed using the Matlab tools provided with 
# this example.
# 
# This configuration assumes that there is a running Jack process with the 
# following parameter settings (as, e.g., started with QjackCtl):
# 
#   Interface:     <sound card to be used by Jack>
#   Sample Rate:   <value of srate (see below)>
#   Frames/Period: <value of fragsize (see below)>
# 
# The configuration uses values that have been pre-computed with the gammatone 
# toolbox by Hohmann and Herzke (2007), which must be downloaded and then added 
# to the Matlab/Octave search path if any changes in the values are required.


# Number of input channels (two ears):
nchannels_in = 2

# Fragment size (in samples per channel); should be the same as the buffer size 
# that the sound card and Jack use (this parameter can be reduced to lower the 
# latency of the system; however, depending on the system, that may cause 
# dropouts/xruns):
fragsize = 1024

# Sampling rate (in Hz); should be the same as the buffer size that the sound 
# card and Jack use:
srate = 48000

# I/O plugin library for live processing:
iolib = MHAIOJackdb

# Jack connection settings (adapt as required):
io.con_in = [system:capture_1 system:capture_2]
io.con_out = [system:playback_1 system:playback_2]
io.name = HSIM

# Top-level plugin (calibration plugin):
mhalib = transducers

# Calibration settings (in dB SPL; replace with the correct calibration values 
# as required):
mha.calib_in.peaklevel = [93.9794 93.9794]
mha.calib_out.peaklevel = [93.9794 93.9794]
mha.plugin_name = mhachain:c

# Top-level plugin chain:
mha.c.algos = [addsndfile fader_wave noise:subnormal_protection split:split_gtfb split:split_dc split:split_smearing matrixmixer]

# The input signal is added from the specified sound file and played back in a 
# loop:
mha.c.addsndfile.path = soundfiles/
mha.c.addsndfile.filename = HSIM_in.wav
mha.c.addsndfile.level = 65.0
mha.c.addsndfile.levelmode = rms
mha.c.addsndfile.channels = [0 1]

# Soft transitions during live configuration changes are ensured by fading in 
# and out:
mha.c.fader_wave.gain = [1.0 1.0]
mha.c.fader_wave.ramplen = 0.25

# The gammatone filterbank plugin (gtfb_analyzer) has no inherent subnormal 
# protection; therefore, low-level protecting noise (in dB SPL) is added:
mha.c.subnormal_protection.lev = -100.0

# The split plugin is used here to compute the gammatone filterbank in parallel 
# to all other processing on a separate CPU (at the cost of one block of delay):
mha.c.split_gtfb.channels = [2]
mha.c.split_gtfb.algos = [mhachain:c]

# The thread/scheduling paramaters should be set according to the following 
# instructions:
# 
#   thread_platform: set to 'posix' for Linux and MacOS, 'win32' for Windows
#   worker_thread_scheduler: set to the return value of 'mha.c.split_gtfb.framework_thread_scheduler?'
#   worker_thread_priority: set to the return value of 'mha.c.split_gtfb.framework_thread_priority?'
# 
mha.c.split_gtfb.thread_platform = win32
mha.c.split_gtfb.worker_thread_scheduler = SCHED_OTHER
mha.c.split_gtfb.worker_thread_priority = 15

# Gammatone filterbank plugin chain:
mha.c.split_gtfb.c.algos = [gtfb_analyzer delay]

# A 32-band gammatone filterbank is used for expansion and spectral smearing. 
# With 32 bands, real and imaginary parts for each band, and two ears, the 
# filterbank produces 128 output channels. The center frequencies are:
# 
#   [73 108 146 189 236 289 348 414 488 569 660 761 874 1000 1140 1296 1470 1664 
#    1879 2119 2387 2685 3017 3387 3799 4259 4770 5340 5974 6681 7469 8346] 
# 
