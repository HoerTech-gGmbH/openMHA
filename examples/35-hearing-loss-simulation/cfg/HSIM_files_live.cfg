# In each band, we use a single-channel gammatone filterbank with a center 
# frequency of 0 Hz for low-pass filtering the noise. A center frequency of 0 Hz 
# implies that the filter coefficient is a real number (i.e., its imaginary part 
# is zero). Its magnitude determines the bandwidth, which is the same as the 
# smearing width. The filter coefficient can be calculated from the desired 
# smearing width as described in Equation 14 in Hohmann (2002). For a fourth-
# order filter centered at 0 Hz at 48000 Hz sampling rate, the coefficient is:
# 
#   coeff = exp(-smearing_width * 6.4/48000).
# 
# The usual normalization strategy for a gammatone filter would let the signal 
# component at the center frequency (here: 0 Hz) pass unmodified. This is not 
# what is needed here; instead, we want the filtered, narrow-band noise to have 
# the same power as the original white noise. Hohmann (2002, Equation 5) gives 
# the frequency response of a fourth-order gammatone filter like the one used 
# here as:
# 
#   K4(z) = 1/(1 - coeff * z^-1)^4.
# 
# We need to integrate the squared magnitude of K4 over the unit circle and use 
# the reciprocal of the square root of this value as the normalization factor. A 
# quick numeric solution in Matlab or Octave is:
# 
#   phi = 0:1e-5:2*pi;
#   norm_phase = 1/sqrt(sum(abs(1./(1 - coeff * exp(1i * phi)).^4).^2)/length(phi));
# 
# The following settings implement frequency-specific spectral smearing 
# corresponding to a symmetric, moderately sloping hearing loss of type N1 
